[project]
name = "paper-chat"
version = "0.1.0"
description = "This app helps self-taught learners understand ML, DL and LLM papers by simplifying them, answering follow-up questions grounded in the paper, and building a learning plan"
readme = "README.md"
authors = [
    { name = "ohziiilov3", email = "klbaskerville0520@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "langchain-community>=0.4.2",
    "langchain-openai>=1.8.5",
    "pydantic>=2.14.4",
    "pypdf>=7.1.1",
]

[project.scripts]
paper-chat = "paper_chat:main"

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]


[tool.pytest.ini_options] 
pythonpath = ["src"]

[tool.ruff] 
line-length = 100
